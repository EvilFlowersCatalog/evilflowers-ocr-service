[project]
name = "evilflowers-ocr-service"
version = "1.0.0"
description = "Celery worker of the EvilFlowers catalog: adds a text layer to scanned PDFs (job kind files.ocr, IP-031) with a choice of OCR engines"
readme = "README.md"
authors = [{ name = "Jakub Dubec", email = "jakub.dubec@stuba.sk" }]
requires-python = ">=3.12,<3.13"
dependencies = [
    "celery[redis]>=5.6,<6",
    # 17.14 is the first release with the built-in RapidOCR engine and `ocr_engine=` selection.
    "ocrmypdf>=17.14,<18",
    "pikepdf>=10",
    "pydantic>=2.12,<3",
    "pydantic-settings>=2.6,<3",
    "python-dotenv>=1.0",
    # The code uses the API only, a no-op without the `otel` extra. One release train with the catalog.
    "opentelemetry-api==1.45.2",
]

[project.optional-dependencies]
# Second engine: PaddleOCR PP-OCRv6/v5 on ONNX Runtime, CPU only (ocrmypdf --ocr-engine rapidocr).
rapidocr = [
    "rapidocr>=3.10,<4",
    "onnxruntime>=1.22",
]
# OTLP/HTTP to the node's Alloy; SDK/exporter 1.x and contrib 0.yb0 move together (as in the catalog).
otel = [
    "opentelemetry-sdk==1.45.2",
    "opentelemetry-exporter-otlp-proto-http==1.45.2",
    "opentelemetry-instrumentation-celery==0.66b2",
    "opentelemetry-instrumentation-system-metrics==0.66b2",
]

[dependency-groups]
# `uv sync` installs the core, the rapidocr engine and this group.
dev = [
    "evilflowers-ocr-service[rapidocr]",
    "opentelemetry-sdk==1.45.2",
    "pytest>=8.3",
    "ruff>=0.14",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/evilflowers_ocr_worker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = ["ignore::DeprecationWarning:importlib._bootstrap"]
markers = ["ocr: runs a real OCR engine (needs Tesseract / RapidOCR models)"]

[tool.ruff]
line-length = 119
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "LOG", "G"]

[tool.ruff.lint.isort]
known-first-party = ["evilflowers_ocr_worker"]
