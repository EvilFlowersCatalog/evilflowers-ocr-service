[project]
name = "evilflowers-ocr-service"
version = "1.0.0"
description = "Celery worker of the EvilFlowers catalog: adds a text layer to scanned PDFs (job kind files.ocr, IP-031) with a choice of OCR engines"
readme = "README.md"
authors = [{ name = "Jakub Dubec", email = "jakub.dubec@stuba.sk" }]
requires-python = ">=3.12,<3.13"
dependencies = [
    # The shared worker runtime (issue #6): Celery config, shutdown, delivery cap, outcome files, telemetry.
    # Its master branch in [tool.uv.sources]; CI locks the commit.
    # `judges`: the decider HTTP client of the suspicious-line check (issue #8, evilflowers-worker#6).
    "evilflowers-worker[judges]",
    "celery[redis]>=5.6,<6",
    # 17.14 is the first release with the built-in RapidOCR engine and `ocr_engine=` selection.
    "ocrmypdf>=17.14,<18",
    "pikepdf>=10",
    # hOCR parsing (standalone hOCR task, issue #7); already in the tree through ocrmypdf.
    "lxml>=5",
    # Leaf images: masks and line crops (already in the tree through ocrmypdf).
    "pillow>=10",
    "pydantic>=2.12,<3",
    "pydantic-settings>=2.6,<3",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# Second engine: PaddleOCR PP-OCRv6/v5 on ONNX Runtime, CPU only (ocrmypdf --ocr-engine rapidocr).
rapidocr = [
    "rapidocr>=3.10,<4",
    "onnxruntime>=1.22",
]
# OTLP/HTTP to the node's Alloy: the kit's telemetry extra (SDK, exporter, Celery and system-metrics instrumentation).
otel = [
    "evilflowers-worker[otel]",
]

[dependency-groups]
# `uv sync` installs the core, the rapidocr engine and this group.
dev = [
    "evilflowers-ocr-service[rapidocr]",
    "opentelemetry-sdk==1.45.2",
    "pytest>=8.3",
    "ruff>=0.14",
]

[tool.uv.sources]
# Stays on branch = "master" (evilflowers-worker#13, issue #12; keep it on one line, resolve-worker rewrites it). CI
# locks the kit per run with evilflowers-actions `resolve-worker`: develop and PRs on its master head, master and tags
# on its newest release tag vX.Y.Z, the repository variable KIT_REF as a hold. The commit in uv.lock is only the local
# baseline; `uv lock --upgrade-package evilflowers-worker` catches up with master.
evilflowers-worker = { git = "https://github.com/EvilFlowersCatalog/evilflowers-worker", branch = "master" }

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/evilflowers_ocr_worker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = ["ignore::DeprecationWarning:importlib._bootstrap"]
markers = ["ocr: runs a real OCR engine (needs Tesseract / RapidOCR models)"]

[tool.ruff]
line-length = 119
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "LOG", "G"]

[tool.ruff.lint.per-file-ignores]
# The line check matches exactly these look-alikes (’ ´ – ×): they are the OCR errors it looks for.
"src/evilflowers_ocr_worker/linecheck.py" = ["RUF001", "RUF002", "RUF003"]
"tests/test_linecheck.py" = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["evilflowers_ocr_worker"]
