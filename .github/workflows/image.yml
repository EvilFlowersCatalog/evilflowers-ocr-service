# OCR service image: resolve evilflowers-worker, test, build, push to GHCR (private), deploy `develop` to dev.
# Contract: knowledge note Deploy-a-Service §1 and §4, the proposal CI-Deploy-Unification (branch → environment,
# "Deployments in LGTM") and the kit rule set EvilFlowersCatalog/evilflowers-worker#13 (this repo: issue #12).
# Diagram: docs/diagrams/sequence-kit-nightly.puml
#
#   push to develop        → resolve, check, build, smoke test, push :develop :sha-<short>, deploy to evilflowers-dev
#   push to master         → the same on the kit's newest release tag, push :master :sha-<short> (no deploy: production
#                            is not on k3s)
#   tag v*.*.*             → as master, push :<X.Y.Z> :sha-<short>
#   push to another branch → push :sha-<short>
#   pull request           → resolve, check, build, smoke test (no push)
#   manual                 → as a push of the chosen ref; input `reason` (manual | nightly)
#   nightly                → nightly.yml dispatches this on develop with reason=nightly when evilflowers-worker
#                            `master` moved past the commit :develop carries. A failing nightly opens an issue.
#
# Which kit: evilflowers-actions `resolve-worker` locks evilflowers-worker for this run only (develop, PRs and other
# branches: the kit's `master` head; master and tags: its newest release tag v*.*.*; the repository variable KIT_REF:
# that ref, a hold). `resolve` hands the pyproject.toml + uv.lock it locked to `check` and `image` as an artifact, so
# the tested and the shipped kit are the same commit. Nothing is committed back: uv.lock in git is only the baseline
# for local development. The commit is the label sk.stuba.elvira.evilflowers-worker.revision (the ref: `.ref`), the env
# EVILFLOWERS_WORKER_REVISION and part of service.version (IMAGE_TAG = <ref>@<sha>+worker.<12>).
#
# Deploy: the dev Deployment `ocr` runs :develop with imagePullPolicy Always, so a new image goes live with a rollout
# restart. The `deploy` job runs on the self-hosted runner INSIDE k3s (runs-on: elvira-k3s), whose ServiceAccount may
# restart Deployments only in `github_runner_deploy_namespaces` (roles/github_runner). It checks that the running pods
# use the digest just pushed, then reports the deploy (succeeded or failed) to LGTM with evilflowers-actions'
# scripts/otlp-deploy.sh: a Loki event and a Tempo span from service.name=github-actions.
#
# evilflowers-actions is referenced at @master: it has no release tag yet. Move every reference (and ACTIONS_REF) to
# @v1 once it is tagged.

name: image

on:
  push:
    branches: ["**"]
    tags: ["v*.*.*"]
  pull_request:
  workflow_dispatch:
    inputs:
      reason:
        description: Why this run, sent as evilflowers.deploy.trigger (nightly.yml sends nightly)
        type: string
        default: manual

permissions:
  contents: read

env:
  IMAGE: ghcr.io/evilflowerscatalog/evilflowers-ocr-service
  ACTIONS_REF: master

jobs:
  resolve:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      worker-revision: ${{ steps.worker.outputs.revision }}
      worker-ref: ${{ steps.worker.outputs.ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
      # Rule 2 of evilflowers-worker#13. On master and tags it rewrites pyproject.toml to tag = "vX.Y.Z", hence both
      # files in the artifact.
      - id: worker
        name: Resolve evilflowers-worker
        uses: EvilFlowersCatalog/evilflowers-actions/.github/actions/resolve-worker@master
        with:
          # A hold (repository variable): every build uses this kit ref, e.g. a known-good tag while master is broken.
          kit-ref: ${{ vars.KIT_REF }}
      - name: Summary
        env:
          REVISION: ${{ steps.worker.outputs.revision }}
          REF: ${{ steps.worker.outputs.ref }}
        run: |
          {
            echo "### evilflowers-worker"
            echo
            echo "\`${REF}\` → [\`${REVISION::7}\`](https://github.com/EvilFlowersCatalog/evilflowers-worker/commit/${REVISION})"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: uv-lock
          path: |
            pyproject.toml
            uv.lock
          retention-days: 7

  check:
    needs: resolve
    runs-on: ubuntu-24.04
    concurrency:
      group: ocr-check-${{ github.ref }}-${{ github.event_name }}
      cancel-in-progress: true
    # tests/test_worker_e2e.py: a real prefork worker against a real Redis.
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: --health-cmd "redis-cli ping" --health-interval 2s --health-timeout 2s --health-retries 15
    env:
      TEST_REDIS_URL: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The lock `resolve` produced, so the tests run on the kit that ships.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: uv-lock
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
          enable-cache: true
      # The real-OCR tests need Tesseract: English for the files.ocr fixtures, Slovak for the standalone hOCR ones
      # (issue #7), rendered with DejaVu (ť ľ ď). Hunspell sk for the line check's lexicon (issue #8).
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-eng tesseract-ocr-slk \
            tesseract-ocr-osd ghostscript fonts-dejavu-core hunspell hunspell-sk
      - name: Install
        run: uv sync --locked --all-extras
      - name: Lint
        run: |
          uv run ruff check
          uv run ruff format --check
      - name: Test
        run: uv run pytest -q

  image:
    needs: [resolve, check]
    runs-on: ubuntu-24.04
    concurrency:
      group: ocr-image-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    env:
      WORKER_REVISION: ${{ needs.resolve.outputs.worker-revision }}
      WORKER_REF: ${{ needs.resolve.outputs.worker-ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The Dockerfile installs from this lock (--frozen), over the committed one.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: uv-lock
      - id: version
        name: service.version
        run: echo "image_tag=${GITHUB_REF_NAME}@${GITHUB_SHA}+worker.${WORKER_REVISION::12}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The tag rule of evilflowers-actions (image.yml): :develop / :master, :X.Y.Z for a release, :sha-<short> always.
      # worker-nightly.yml reads the kit label of :develop.
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ github.ref_name }},enable=${{ github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/master' }}
            type=match,pattern=^v?(\d+\.\d+\.\d+)$,group=1
            type=sha,prefix=sha-,format=short
          labels: |
            sk.stuba.elvira.evilflowers-worker.revision=${{ env.WORKER_REVISION }}
            sk.stuba.elvira.evilflowers-worker.ref=${{ env.WORKER_REF }}
      # Build once into the local daemon, prove the image works the way k8s runs it, then push.
      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: ocr-service:smoke
          build-args: |
            IMAGE_TAG=${{ steps.version.outputs.image_tag }}
            EVILFLOWERS_WORKER_REVISION=${{ env.WORKER_REVISION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Read-only root, no network, uid 65534, /tmp as the only writable path: every model must be
      # baked in, and both engines must OCR a page in a Latin and a Cyrillic language. Then: the installed kit is
      # the commit `resolve` locked and `check` tested.
      - name: Smoke test (read-only, offline, non-root)
        run: |
          docker run --rm --read-only --network none --user 65534:65534 --tmpfs /tmp \
            ocr-service:smoke python -m evilflowers_ocr_worker selftest -l slk ces eng rus
          installed="$(docker run --rm --network none ocr-service:smoke python -c \
            "import json, importlib.metadata as m; print(json.loads(m.distribution('evilflowers-worker').read_text('direct_url.json'))['vcs_info']['commit_id'])")"
          echo "evilflowers-worker in the image: ${installed}"
          test "$installed" = "$WORKER_REVISION" || { echo "::error::image has evilflowers-worker ${installed}, expected ${WORKER_REVISION}"; exit 1; }
      - id: build
        name: Push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            IMAGE_TAG=${{ steps.version.outputs.image_tag }}
            EVILFLOWERS_WORKER_REVISION=${{ env.WORKER_REVISION }}
          cache-from: type=gha
      - name: Summary
        if: github.event_name != 'pull_request'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "### Image"
            echo
            echo '```'
            echo "$TAGS"
            echo "digest: ${DIGEST}"
            echo "evilflowers-worker: ${WORKER_REF} ${WORKER_REVISION}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: [resolve, image]
    # Every push to develop, the nightly (a workflow_dispatch with reason=nightly) and a manual run of develop. master is
    # production, which is not on k3s yet: it is built and pushed, never deployed from here.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/develop'
    runs-on: elvira-k3s            # ARC scale set in k3s (knowledge: roles/github_runner)
    environment:
      name: development
    concurrency:
      group: deploy-ocr-evilflowers-dev
      cancel-in-progress: false
    permissions: {}
    env:
      TARGET_NAMESPACE: evilflowers-dev
      TARGET_ENVIRONMENT: development
      DEPLOY_DEPLOYMENTS: ocr
      DIGEST: ${{ needs.image.outputs.digest }}
      WORKER_REVISION: ${{ needs.resolve.outputs.worker-revision }}
      WORKER_REF: ${{ needs.resolve.outputs.worker-ref }}
      # push / nightly / manual: what started this deploy (evilflowers.deploy.trigger).
      TRIGGER: ${{ github.event_name == 'workflow_dispatch' && (inputs.reason || 'manual') || github.event_name }}
      KUBECTL_VERSION: v1.31.5     # = the cluster (k3s v1.31.5+k3s1)
      KUBECTL_SHA256: fbecbfd375b3686002c2e81d51c390172f5ffba3d6b47920d55342cb03f557af   # dl.k8s.io …/linux/amd64/kubectl.sha256
    steps:
      - name: kubectl ${{ env.KUBECTL_VERSION }} (checksum-pinned)
        run: |
          curl -fsSLo "$RUNNER_TEMP/kubectl" "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          echo "${KUBECTL_SHA256}  $RUNNER_TEMP/kubectl" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/kubectl"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      # In-cluster credentials: the pod's ServiceAccount arc-deployer. The deploy span starts here.
      - name: Restart onto the new :develop
        run: |
          echo "DEPLOY_START_NS=$(date +%s%N)" >> "$GITHUB_ENV"
          kubectl -n "$TARGET_NAMESPACE" rollout restart "deployment/$DEPLOY_DEPLOYMENTS"
      # A Celery worker has no port and no probes: `rollout status` returns once the new pod runs.
      # The old pod may be finishing a book (terminationGracePeriodSeconds), hence the long timeout.
      - name: Wait for the rollout
        run: kubectl -n "$TARGET_NAMESPACE" rollout status "deployment/$DEPLOY_DEPLOYMENTS" --timeout=900s
      - name: Running pods use ${{ env.DIGEST }}
        run: |
          ids=$(kubectl -n "$TARGET_NAMESPACE" get pods -l "app.kubernetes.io/name=$DEPLOY_DEPLOYMENTS" \
            -o go-template='{{range .items}}{{if not .metadata.deletionTimestamp}}{{range .status.containerStatuses}}{{.imageID}}{{"\n"}}{{end}}{{end}}{{end}}')
          echo "$ids"
          test -n "$ids"
          if echo "$ids" | grep -v -- "@${DIGEST}\$"; then
            echo "::error::a running pod does not use ${DIGEST}"
            exit 1
          fi
          echo "DEPLOY_END_NS=$(date +%s%N)" >> "$GITHUB_ENV"
      # Succeeded or failed, the deploy is an event in Loki and a span in Tempo. The script is evilflowers-actions'
      # (its v1 contract), fetched anonymously: the repository is public. Never fails the job.
      - id: event
        name: Report the deploy to LGTM
        if: success() || failure()
        env:
          OUTCOME: ${{ job.status == 'success' && 'succeeded' || 'failed' }}
        run: |
          script="$RUNNER_TEMP/otlp-deploy.sh"
          if curl -fsSL --max-time 20 -o "$script" \
            "https://raw.githubusercontent.com/EvilFlowersCatalog/evilflowers-actions/${ACTIONS_REF}/scripts/otlp-deploy.sh"; then
            bash "$script" "$OUTCOME" || echo "::warning::otlp-deploy.sh failed; the deploy itself is unaffected"
          else
            echo "::warning::could not fetch otlp-deploy.sh at ${ACTIONS_REF}; deploy event not sent"
          fi
      - name: Summary
        if: always()
        env:
          STATUS: ${{ job.status }}
          TRACE_ID: ${{ steps.event.outputs.trace_id }}
        run: |
          {
            echo "### Deploy to ${TARGET_NAMESPACE}: ${STATUS} (${TRIGGER})"
            echo
            echo "Digest \`${DIGEST}\`, commit \`${GITHUB_SHA::7}\`, evilflowers-worker \`${WORKER_REF}\` = \`${WORKER_REVISION::7}\`."
            echo
            echo "Grafana (VPN): http://grafana.observability.stu.k8s.internal → Explore"
            echo "- Deploy event: \`{service_name=\"github-actions\"} | event_name=\"deployment\" | k8s_deployment_name=\"${DEPLOY_DEPLOYMENTS}\"\`"
            if [ -n "$TRACE_ID" ]; then
              echo "- Deploy span: Tempo trace \`${TRACE_ID}\`"
            fi
            echo "- Tempo: \`{resource.service.name=\"ocr\" && resource.service.version=~\".*worker.${WORKER_REVISION::12}\"}\`"
            echo "- Loki: \`{namespace=\"${TARGET_NAMESPACE}\", service_name=\"ocr\"} | json\`"
            echo "- Mimir: \`ocr_pages_total\`, \`ocr_duration_seconds_bucket\`, \`ocr_job_outcome_total\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # A nightly run that fails (most likely: the new evilflowers-worker master breaks ocr) becomes an issue. One open
  # issue per streak: the next failing night comments on it instead of opening another.
  report-nightly-failure:
    needs: [resolve, check, image, deploy]
    if: failure() && github.event_name == 'workflow_dispatch' && inputs.reason == 'nightly'
    runs-on: ubuntu-24.04
    permissions:
      issues: write
    steps:
      - uses: EvilFlowersCatalog/evilflowers-actions/.github/actions/report-nightly-failure@master
        with:
          revision: ${{ needs.resolve.outputs.worker-revision }}
          results: resolve=${{ needs.resolve.result }} check=${{ needs.check.result }} image=${{ needs.image.result }} deploy=${{ needs.deploy.result }}
